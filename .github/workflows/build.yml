name: Build and runtime check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: curl -fL --retry 3 -o "$RUNNER_TEMP/server-release.jar" https://github.com/Anuken/Mindustry/releases/download/v160.2/server-release.jar
      - run: bash ./gradlew --no-daemon jar smokeTest -PmindustryRuntimeJar="$RUNNER_TEMP/server-release.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: modular-shipyard-desktop
          path: build/libs/modular-shipyardDesktop.jar
